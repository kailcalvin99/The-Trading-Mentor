# Provider-neutral example only. It does not create resources.
runtime: node>=20.12.0
services:
  api:
    build: pnpm --filter @workspace/api-server build
    start: pnpm --filter @workspace/api-server start
    liveness: /api/healthz
    readiness: /api/readyz
  web:
    build: PORT=5173 BASE_PATH=/web/ EXPO_PUBLIC_DOMAIN=thetradingmentorai.com pnpm --filter @workspace/web build
    static_root: artifacts/web/dist
routing:
  - path: /api/*
    destination: api
  - path: /web/*
    destination: web
    spa_fallback: /web/index.html
jobs:
  migrate:
    command: pnpm --filter @workspace/db migrate
    automatic_on_startup: false
  stripe_bootstrap:
    command: pnpm stripe:bootstrap
    automatic_on_startup: false
